name: Build desktop apps and publish release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: MindList-macOS
          - os: windows-latest
            platform: win
            artifact: MindList-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        if: matrix.platform == 'mac'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Windows packages
        if: matrix.platform == 'win'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify desktop interactions
        if: matrix.platform == 'mac'
        run: npm run test:desktop

      - name: Upload macOS packages
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows packages
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          version = Path("package.json").read_text()
          import json, os
          expected = "v" + json.loads(version)["version"]
          if expected != os.environ["GITHUB_REF_NAME"]:
              raise SystemExit("Release tag and package version differ")
          expected_files = {
              f"MindList-{expected[1:]}-macOS-arm64.dmg",
              f"MindList-{expected[1:]}-macOS-x64.dmg",
              f"MindList-{expected[1:]}-Windows-Setup-x64.exe",
              f"MindList-{expected[1:]}-Windows-Portable-x64.exe",
          }
          if {p.name for p in Path("release").iterdir()} != expected_files:
              raise SystemExit("Release packages are missing or unexpected")
          notes = Path("CHANGELOG.md").read_text().split("## [", 2)[1]
          notes = notes.split("\n", 1)[1].strip()
          Path("release-notes.txt").write_text(notes)
          PYTHON
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "MindList $GITHUB_REF_NAME" --notes-file release-notes.txt
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --title "MindList $GITHUB_REF_NAME" --notes-file release-notes.txt
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
